apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp
  labels:
    app: webapp-gitops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: webapp-gitops
  template:
    metadata:
      labels:
        app: webapp-gitops
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
                